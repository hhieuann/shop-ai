name: Deploy dev & staging

# develop    -> môi trường dev (shop-dev)
# release/*  -> môi trường staging (shop-stg), nơi cả nhóm test trước khi phát hành
on:
  push:
    branches: [develop, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name == 'develop' && 'dev' || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name == 'develop' && 'dev' || 'staging' }}
    # Bật bằng biến DEPLOY_ENABLED=true sau khi đã cấu hình OIDC (infra/README.md).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'develop' && 'dev' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    env:
      TARGET: ${{ github.ref_name == 'develop' && 'dev' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cài thư viện
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Đăng nhập AWS (OIDC, không access key)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: cdk deploy
        run: pnpm --filter infra run "deploy:$TARGET"
      - name: Smoke test
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: pnpm run test:smoke
      - name: Cài trình duyệt cho E2E giao diện
        if: hashFiles('tests/e2e-ui/package.json') != ''
        run: pnpm --filter e2e-ui exec playwright install --with-deps chromium
      - name: E2E (Postman/Newman, Playwright nếu có)
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          COGNITO_CLIENT_ID: ${{ vars.E2E_COGNITO_CLIENT_ID }}
          E2E_USERNAME: ${{ vars.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: pnpm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-reports-${{ env.TARGET }}
          path: |
            tests/e2e-api/reports
            tests/e2e-ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7
