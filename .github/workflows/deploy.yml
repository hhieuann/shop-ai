name: Deploy dev & staging

# develop    -> môi trường dev (shop-dev)
# release/*  -> môi trường staging (shop-stg), nơi cả nhóm test trước khi phát hành
on:
  push:
    branches: [develop, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name == 'develop' && 'dev' || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name == 'develop' && 'dev' || 'staging' }}
    # Bật bằng biến DEPLOY_ENABLED=true sau khi đã cấu hình OIDC (infra/README.md).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'develop' && 'dev' || 'staging' }}
    permissions:
      contents: read
      id-token: write
    env:
      TARGET: ${{ github.ref_name == 'develop' && 'dev' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cài thư viện
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Đăng nhập AWS (OIDC, không access key)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: cdk deploy
        # Email nhận cảnh báo để ở secret, GitHub che thành *** trong log (log repo public ai cũng xem được)
        env:
          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
          # Địa chỉ gửi SES chung cho mọi môi trường (một tài khoản, một vùng); thiếu thì worker không gửi email
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: pnpm --filter infra run "deploy:$TARGET" --outputs-file cdk-outputs.json -c alarmEmail="$ALARM_EMAIL" -c senderEmail="$SENDER_EMAIL"
      - name: Lấy URL CloudFront từ output của stack web
        # Lần deploy đầu của một môi trường chưa có biến BASE_URL; đọc thẳng output WebUrl để smoke test vẫn chạy.
        # Biến BASE_URL của environment chỉ còn là dự phòng.
        env:
          FALLBACK_BASE_URL: ${{ vars.BASE_URL }}
        run: |
          url=$(node -p "const o = require('./infra/cdk-outputs.json'); Object.entries(o).find(([k]) => k.endsWith('-web'))?.[1].WebUrl ?? ''")
          echo "BASE_URL=${url:-$FALLBACK_BASE_URL}" >> "$GITHUB_ENV"
          echo "Smoke test chạy với ${url:-$FALLBACK_BASE_URL}"
      - name: Smoke test
        run: pnpm run test:smoke
      - name: Cài trình duyệt cho E2E giao diện
        if: hashFiles('tests/e2e-ui/package.json') != ''
        run: pnpm --filter e2e-ui exec playwright install --with-deps chromium
      - name: E2E (API bằng Vitest theo ADR-0018, giao diện bằng Playwright nếu có)
        env:
          COGNITO_CLIENT_ID: ${{ vars.E2E_COGNITO_CLIENT_ID }}
          E2E_USERNAME: ${{ vars.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: pnpm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-reports-${{ env.TARGET }}
          path: |
            tests/e2e-api/reports
            tests/e2e-ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7
