name: Nightly

on:
  schedule:
    - cron: '0 19 * * *' # 02:00 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    name: OWASP ZAP baseline (staging)
    if: vars.STAGING_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.STAGING_URL }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline

  schemathesis:
    name: Schemathesis (API staging)
    if: vars.STAGING_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Fuzz API theo OpenAPI
        env:
          API_URL: ${{ vars.STAGING_URL }}
        # unsupported_method: CloudFront tự trả 405 cho TRACE không kèm header Allow, request không tới API.
        # content_type_conformance: API Gateway từ chối URL hỏng trước Lambda, trả JSON thay vì problem+json.
        # /api/v1/admin: contract trên develop đã có API admin (#380) nhưng staging chưa có route tới khi
        # tách release 10/11; bỏ dòng exclude này sau đó (An, 06/11).
        run: >-
          uvx schemathesis==4.33.1 run contracts/openapi.yaml --url "$API_URL"
          --exclude-checks unsupported_method,content_type_conformance
          --exclude-path-regex '^/api/v1/admin'

  audit:
    name: Audit thư viện
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm audit (chỉ báo cáo)
        continue-on-error: true
        run: pnpm audit --audit-level moderate

  k6-smoke:
    name: k6 smoke (staging)
    if: vars.STAGING_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chưa có kịch bản k6
        if: hashFiles('tests/load/smoke.js') == ''
        run: echo "Chưa có tests/load/smoke.js, bỏ qua."
      - name: Chạy kịch bản nhỏ
        if: hashFiles('tests/load/smoke.js') != ''
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
        run: docker run --rm -i -e BASE_URL grafana/k6:2.3.0 run - < tests/load/smoke.js
