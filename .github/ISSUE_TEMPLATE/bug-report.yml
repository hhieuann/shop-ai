name: Báo lỗi
description: Một chức năng chạy sai so với tiêu chí nghiệm thu
title: '[Bug] '
labels: ['bug']
body:
  - type: dropdown
    id: environment
    attributes:
      label: Môi trường
      options:
        - dev (stack cá nhân)
        - staging
        - prod
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Mong đợi và thực tế
      placeholder: Mong đợi ... nhưng thực tế ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Bằng chứng
      description: traceId trong response lỗi, ảnh chụp, log. Che thông tin cá nhân và account ID.
